name: Code Quality Check

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Check runtime compatibility every Monday at 04:47 UTC.
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Test discovery and list stable runtimes
        id: versions
        uses: actions/github-script@v7
        with:
          script: |
            require('node:child_process').execFileSync(process.execPath,
              ['--test', '.github/scripts/runtime-matrix.test.cjs'], {stdio: 'inherit'});
            await require('./.github/scripts/runtime-matrix.cjs')({core});

  build:
    needs: discover
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.discover.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          allow-prereleases: false
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.py
            tox.ini

      - name: Install test tooling
        run: python -m pip install 'tox>=4.11,<5'

      - name: Test and smoke-test the packaged client
        # Generic py uses the interpreter selected by setup-python.
        run: python -m tox -e py
