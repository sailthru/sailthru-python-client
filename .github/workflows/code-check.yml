name: Code Quality Check

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Check runtime compatibility every Monday at 04:47 UTC.
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python == '3.x' && 'current' || matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 3.x follows new stable Python 3 releases without changing this file.
        python: ['3.11', '3.12', '3.13', '3.14', '3.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          allow-prereleases: false
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.py
            tox.ini

      - name: Install test tooling
        run: python -m pip install 'tox>=4.11,<5'

      - name: Test and smoke-test the packaged client
        # Generic py uses the interpreter selected by setup-python, including 3.x.
        run: python -m tox -e py
